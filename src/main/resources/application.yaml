spring:
  application:
    name: ai-tech-marketplace-backend

  datasource:
    url: jdbc:postgresql://localhost:55433/ai_marketplace
    username: ai_marketplace
    password: ai_marketplace_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    access-key: ${S3_ACCESS_KEY:admin}
    secret-key: ${S3_SECRET_KEY:ai-marketplace-secret}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:products}
