services:
  postgres:
    image: postgres:17
    container_name: ai-tech-marketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_marketplace
      POSTGRES_USER: ai_marketplace
      POSTGRES_PASSWORD: ai_marketplace_dev

    ports:
      - "55433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_marketplace -d ai_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:latest
    container_name: ai-tech-marketplace-object-storage
    restart: unless-stopped

    command: server -dir=/data -s3

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: ai-marketplace-secret
      S3_BUCKET: products

    ports:
      - "8333:8333"

    volumes:
      - object_storage_data:/data

volumes:
  postgres_data:
  object_storage_data:
